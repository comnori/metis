name: Desktop Full

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open PR number; leave empty to validate main'
        type: string
        required: false

permissions:
  contents: read
  pull-requests: read

jobs:
  target:
    name: Resolve validation target
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Resolve main or PR merge commit
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/validation-target.mjs

  desktop:
    name: Full / ${{ matrix.os }}
    needs: target
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - name: Linux desktop dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Typecheck, unit tests and build
        run: npm run check
      - name: Development integration
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Development integration under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npm run package
      - name: Packaged integration
        if: runner.os != 'Linux'
        run: npm run test:integration:packaged
      - name: Packaged integration under Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration:packaged
      - name: Validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-validation-${{ matrix.os }}
          retention-days: 14
          include-hidden-files: true
          path: |
            .pre04-runs/integration-*/results.json
            .pre04-runs/integration-*/*.log
            .pre04-runs/smoke-*/results.json
            .pre04-runs/smoke-*/*.png
            .pre04-runs/m1-*/results.json
            .pre04-runs/m1-*/*.png
            .pre04-runs/m2-*/results.json
            .pre04-runs/m2-*/*.png

            .pre04-runs/m3-*/results.json
            .pre04-runs/m3-*/*.png
