name: Desktop release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version increment'
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release candidate
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      base_sha: ${{ steps.candidate.outputs.base_sha }}
      candidate_sha: ${{ steps.candidate.outputs.candidate_sha }}
      tag: ${{ steps.candidate.outputs.tag }}
      previous_tag: ${{ steps.candidate.outputs.previous_tag }}
    steps:
      - name: Require main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ]; then
            echo 'Manual releases must run on main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Find previous stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          PREVIOUS_TAG="$(gh release list --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // ""')"
          echo "PREVIOUS_TAG=$PREVIOUS_TAG" >> "$GITHUB_ENV"
      - name: Prepare version commit without pushing
        id: candidate
        env:
          BUMP: ${{ inputs.bump }}
        run: node scripts/release-version.mjs prepare .pre04-runs/release-candidate
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate
          path: .pre04-runs/release-candidate/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  package:
    name: Package / ${{ matrix.asset }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            asset: windows-x64
          - os: macos-14
            asset: macos-arm64
          - os: ubuntu-22.04
            asset: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35

    steps:
      - name: Checkout release base
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24.21.0"
          cache: npm

      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: .pre04-runs/release-candidate
      - name: Apply pinned version commit
        run: node scripts/release-version.mjs apply .pre04-runs/release-candidate

      - name: Install dependencies
        run: npm ci

      - name: Core validation
        run: npm run check

      - name: Package desktop application
        run: npm run package

      - name: Locate packaged application
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          $stage = (Get-Content .pre04-runs/latest-package.txt -Raw).Trim()
          $packageDirectory = Get-ChildItem (Join-Path $stage "out") -Directory
          if ($packageDirectory.Count -ne 1) {
            throw "Expected exactly one packaged application, found $($packageDirectory.Count)."
          }
          "PACKAGE_DIRECTORY=$($packageDirectory.FullName)" >> $env:GITHUB_ENV
          "ASSET_NAME=Metis-$env:RELEASE_TAG-${{ matrix.asset }}.zip" >> $env:GITHUB_ENV

      - name: Create Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -LiteralPath $env:PACKAGE_DIRECTORY -DestinationPath $env:ASSET_NAME

      - name: Create macOS ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent "$PACKAGE_DIRECTORY" "$ASSET_NAME"

      - name: Create Linux ZIP
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd "$(dirname "$PACKAGE_DIRECTORY")"
          zip -r "$GITHUB_WORKSPACE/$ASSET_NAME" "$(basename "$PACKAGE_DIRECTORY")"

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: release-package-${{ matrix.asset }}
          path: Metis-*.zip
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'

      - uses: actions/download-artifact@v8
        with:
          name: release-candidate
          path: .pre04-runs/release-candidate

      - name: Apply pinned release candidate
        run: node scripts/release-version.mjs apply .pre04-runs/release-candidate

      - name: Download packaged applications
        uses: actions/download-artifact@v8
        with:
          pattern: release-package-*
          path: release-assets
          merge-multiple: true

      - name: Verify release artifacts
        id: security
        continue-on-error: true
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.prepare.outputs.previous_tag }}
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        run: |
          node scripts/virustotal-release.mjs \
            --assets release-assets \
            --output release-evidence \
            --current-tag "$RELEASE_TAG" \
            --previous-tag "$PREVIOUS_TAG"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-security-${{ needs.prepare.outputs.tag }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce security verification
        if: steps.security.outcome != 'success'
        shell: bash
        run: |
          echo "Release security verification failed; the GitHub Release will not be created." >&2
          exit 1

      - name: Atomically push version commit and tag
        run: node scripts/release-version.mjs push .pre04-runs/release-candidate

      - name: Publish or verify GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/publish-release.mjs .pre04-runs/release-candidate release-assets release-evidence
