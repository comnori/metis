<svg xmlns="http://www.w3.org/2000/svg" id="git-policy" width="744" class="flowchart" style="max-width: 744px;" viewBox="4 4 744 544" role="graphics-document document" aria-roledescription="flowchart-v2" height="544"><style>#git-policy{font-family:Arial,"Malgun Gothic",sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#git-policy .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#git-policy .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#git-policy .error-icon{fill:#552222;}#git-policy .error-text{fill:#552222;stroke:#552222;}#git-policy .edge-thickness-normal{stroke-width:1px;}#git-policy .edge-thickness-thick{stroke-width:3.5px;}#git-policy .edge-pattern-solid{stroke-dasharray:0;}#git-policy .edge-thickness-invisible{stroke-width:0;fill:none;}#git-policy .edge-pattern-dashed{stroke-dasharray:3;}#git-policy .edge-pattern-dotted{stroke-dasharray:2;}#git-policy .marker{fill:#333333;stroke:#333333;}#git-policy .marker.cross{stroke:#333333;}#git-policy svg{font-family:Arial,"Malgun Gothic",sans-serif;font-size:16px;}#git-policy p{margin:0;}#git-policy .label{font-family:Arial,"Malgun Gothic",sans-serif;color:#333;}#git-policy .cluster-label text{fill:#333;}#git-policy .cluster-label span{color:#333;}#git-policy .cluster-label span p{background-color:transparent;}#git-policy .label text,#git-policy span{fill:#333;color:#333;}#git-policy .node rect,#git-policy .node circle,#git-policy .node ellipse,#git-policy .node polygon,#git-policy .node path{fill:#ECECFF;stroke:#9370DB;stroke-width:1px;}#git-policy .rough-node .label text,#git-policy .node .label text,#git-policy .image-shape .label,#git-policy .icon-shape .label{text-anchor:middle;}#git-policy .node .katex path{fill:#000;stroke:#000;stroke-width:1px;}#git-policy .rough-node .label,#git-policy .node .label,#git-policy .image-shape .label,#git-policy .icon-shape .label{text-align:center;}#git-policy .node.clickable{cursor:pointer;}#git-policy .root .anchor path{fill:#333333!important;stroke-width:0;stroke:#333333;}#git-policy .arrowheadPath{fill:#333333;}#git-policy .edgePaths .path{stroke:#333333;stroke-width:1px;}#git-policy .flowchart-link{stroke:#333333;fill:none;}#git-policy .edgeLabel{background-color:rgba(232,232,232, 0.8);text-align:center;}#git-policy .edgeLabel p{background-color:rgba(232,232,232, 0.8);}#git-policy .edgeLabel rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#git-policy .labelBkg{background-color:rgba(232, 232, 232, 0.5);}#git-policy .cluster rect{fill:#ffffde;stroke:#aaaa33;stroke-width:1px;}#git-policy .cluster text{fill:#333;}#git-policy .cluster span{color:#333;}#git-policy .node .collapsed-indicator{fill:#aaaa33;stroke:none;opacity:0.6;}#git-policy .node .collapsed-separator{stroke:#aaaa33;stroke-width:0.75px;}#git-policy div.mermaidTooltip{position:absolute;text-align:center;max-width:200px;padding:2px;font-family:Arial,"Malgun Gothic",sans-serif;font-size:12px;background:hsl(80, 100%, 96.2745098039%);border:1px solid #aaaa33;border-radius:2px;pointer-events:none;z-index:100;}#git-policy .flowchartTitleText{text-anchor:middle;font-size:18px;fill:#333;}#git-policy rect.text{fill:none;stroke-width:0;}#git-policy .icon-shape,#git-policy .image-shape{background-color:rgba(232,232,232, 0.8);text-align:center;}#git-policy .icon-shape p,#git-policy .image-shape p{background-color:rgba(232,232,232, 0.8);padding:2px;}#git-policy .icon-shape .label rect,#git-policy .image-shape .label rect{opacity:0.5;background-color:rgba(232,232,232, 0.8);fill:rgba(232,232,232, 0.8);}#git-policy .label-icon{display:inline-block;height:1em;overflow:visible;vertical-align:-0.125em;}#git-policy .node .label-icon path{fill:currentColor;stroke:revert;stroke-width:revert;}#git-policy .node .neo-node{stroke:#9370DB;}#git-policy [data-look="neo"].node rect,#git-policy [data-look="neo"].cluster rect,#git-policy [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#git-policy [data-look="neo"].swimlane.cluster rect{filter:none;}#git-policy [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#git-policy [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#git-policy [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#git-policy [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#git-policy [data-look="neo"].node circle .state-start{fill:#000000;}#git-policy [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#git-policy [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#git-policy :root{--mermaid-font-family:Arial,"Malgun Gothic",sans-serif;}</style><g><marker id="git-policy_flowchart-v2-pointEnd" class="marker flowchart-v2" viewBox="0 0 10 10" refX="5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="git-policy_flowchart-v2-pointStart" class="marker flowchart-v2" viewBox="0 0 10 10" refX="4.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 5 L 10 10 L 10 0 z" class="arrowMarkerPath" style="stroke-width: 1; stroke-dasharray: 1, 0;"/></marker><marker id="git-policy_flowchart-v2-pointEnd-margin" class="marker flowchart-v2" viewBox="0 0 11.5 14" refX="11.5" refY="7" markerUnits="userSpaceOnUse" markerWidth="10.5" markerHeight="14" orient="auto"><path d="M 0 0 L 11.5 7 L 0 14 z" class="arrowMarkerPath" style="stroke-width: 0; stroke-dasharray: 1, 0;"/></marker><marker id="git-pol